<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Hijab Store cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsla(36, 32%, 8%, 1)"/>
      <stop offset="0.55" stop-color="hsla(36, 28%, 5%, 1)"/>
      <stop offset="1" stop-color="#040406"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.18" cy="0.2" r="0.6">
      <stop offset="0" stop-color="hsla(36, 90%, 60%, 0.55)"/>
      <stop offset="1" stop-color="hsla(36, 90%, 60%, 0)"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.9" cy="0.95" r="0.7">
      <stop offset="0" stop-color="hsla(48, 85%, 58%, 0.4)"/>
      <stop offset="1" stop-color="hsla(48, 85%, 58%, 0)"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="rgba(255,255,255,0.05)"/>
    </pattern>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="hsla(36, 70%, 82%, 1)"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#orbA)"/>
  <rect width="1600" height="900" fill="url(#orbB)"/>

